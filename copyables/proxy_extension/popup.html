<!DOCTYPE html>
<html lang="UTF-8">
<head>
    <meta charset="UTF-8">
    <title>Proxy Credentials</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 200px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h3>Proxy Credentials</h3>
    <div id="credentials">
        <p>Username: <span id="username"></span></p>
        <p>Password: <span id="password"></span></p>
        <p>Host: <span id="host"></span></p>
        <p>Port: <span id="port"></span></p>
        <p>Proxy Enabled: <span id="proxyEnabled"></span></p>
    </div>
    <button id="toggleProxy">切换代理</button>
    <script src="popup.js"></script>
</body>
</html>
